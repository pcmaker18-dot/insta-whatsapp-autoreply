[package]
name = "insta-autoreply-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
